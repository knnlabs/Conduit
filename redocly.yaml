extends:
  - recommended

rules:
  no-server-example.com: off
  no-empty-servers: off
  # The ratchet validator enforces these per operation against the checked-in
  # allowlist. Redocly reports the remaining debt without making it a big-bang gate.
  operation-summary: warn
  info-license: off
  tag-description: off
  operation-4xx-response: warn
