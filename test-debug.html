<!DOCTYPE html>
<html>
<head>
    <title>Debug Streaming</title>
</head>
<body>
    <h1>Debug gpt-oss-120b Streaming</h1>
    <button onclick="testStreaming()">Test "What is the history of France?"</button>
    <pre id="output" style="white-space: pre-wrap;"></pre>
    
    <script>
        async function testStreaming() {
            const output = document.getElementById('output');
            output.textContent = 'Starting test...\n\n';
            
            try {
                const response = await fetch('http://localhost:3000/api/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-oss-120b',
                        messages: [{role: 'user', content: 'What is the history of France?'}],
                        stream: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let totalContent = '';
                let totalReasoning = '';
                let chunkCount = 0;
                let contentChunkCount = 0;
                let reasoningChunkCount = 0;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.trim() === '') continue;
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                output.textContent += '\n========== STREAM COMPLETE ==========\n';
                                output.textContent += `Total chunks: ${chunkCount}\n`;
                                output.textContent += `Content chunks: ${contentChunkCount}\n`;
                                output.textContent += `Reasoning chunks: ${reasoningChunkCount}\n`;
                                output.textContent += `\nTotal content (${totalContent.length} chars): "${totalContent.substring(0, 100)}..."\n`;
                                output.textContent += `\nTotal reasoning (${totalReasoning.length} chars): "${totalReasoning.substring(0, 100)}..."\n`;
                                continue;
                            }
                            
                            try {
                                const chunk = JSON.parse(data);
                                chunkCount++;
                                const delta = chunk.choices?.[0]?.delta;
                                
                                if (delta) {
                                    if (delta.content !== undefined) {
                                        contentChunkCount++;
                                        totalContent += delta.content;
                                        if (chunkCount <= 10 || delta.content) {
                                            output.textContent += `[Chunk ${chunkCount}] Content: "${delta.content}"\n`;
                                        }
                                    }
                                    if (delta.reasoning !== undefined) {
                                        reasoningChunkCount++;
                                        totalReasoning += delta.reasoning;
                                        if (chunkCount <= 10) {
                                            output.textContent += `[Chunk ${chunkCount}] Reasoning: "${delta.reasoning}" (channel: ${delta.channel})\n`;
                                        }
                                    }
                                    if (delta.role) {
                                        output.textContent += `[Chunk ${chunkCount}] Role: ${delta.role}\n`;
                                    }
                                }
                            } catch (e) {
                                output.textContent += `Parse error: ${e.message}\n`;
                            }
                        }
                    }
                }
            } catch (error) {
                output.textContent += `\nError: ${error.message}\n`;
            }
        }
        
        // Auto-run on load
        window.onload = () => {
            console.log('Debug page loaded. Click button to test.');
        };
    </script>
</body>
</html>
