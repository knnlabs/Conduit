map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $conduit_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream conduit_webadmin {
    server webadmin:3000;
}

upstream conduit_grafana {
    server grafana:3000;
}

server {
    listen 8080;
    server_name _;

    location = /_grafana_auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://conduit_webadmin/api/auth/grafana;
    }

    location = /grafana {
        return 308 /grafana/;
    }

    location ^~ /grafana/ {
        auth_request /_grafana_auth;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $conduit_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Grafana is deliberately anonymous behind this authorization boundary.
        # Do not forward browser credentials or allow Grafana to set auth cookies.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://conduit_grafana;
    }

    # Browser source maps are retained in the deployment artifact for authorized
    # error symbolication, but are never served through the public edge.
    location ~* \.map$ {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $conduit_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://conduit_webadmin;
    }
}
