name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version and channel
        id: version
        # A tag is a pre-release iff its name contains a hyphen (SemVer rule).
        # This single decision drives the GitHub Release flag, the Docker floating
        # tag, and the npm dist-tag so all three channels stay consistent.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          # Only stable releases become the repo's "Latest" (and appear in
          # /releases/latest); betas never move the badge.
          make_latest: ${{ steps.version.outputs.channel == 'latest' }}

  docker:
    name: Docker - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: webadmin
            context: .
            dockerfile: WebAdmin/Dockerfile
          - service: http
            context: .
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile
          - service: admin
            context: .
            dockerfile: Services/ConduitLLM.Admin/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Immutable version pin + the floating channel tag (:latest for stable,
          # :beta for pre-releases). A pre-release never overwrites :latest.
          tags: |
            ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}:${{ needs.release.outputs.channel }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  npm:
    name: NPM Release
    runs-on: ubuntu-latest
    needs: release
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          # Workspaces monorepo: a single root lockfile (no per-package locks exist).
          cache-dependency-path: SDKs/Node/package-lock.json

      - name: Update versions and publish
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          CHANNEL="${{ needs.release.outputs.channel }}"

          cd SDKs/Node

          # Install from the lockfile and build BEFORE editing any package.json,
          # so npm ci sees a consistent, in-sync tree. tsup resolves the
          # file:../Common workspace links during the build.
          npm ci
          npm run build

          # Stamp the unified release version onto all three published packages.
          # `npm pkg set` writes the field directly (no same-version error, no git tag).
          npm pkg set version="$VERSION" --workspace Common --workspace Admin --workspace Gateway

          # Pin the published Common dependency to the exact release version. Editing
          # package.json directly avoids a registry fetch, so this works even though
          # Common@$VERSION has not been published yet.
          npm pkg set "dependencies.@knn_labs/conduit-common=$VERSION" --workspace Admin --workspace Gateway

          # Publish Common first — Admin and Gateway depend on it. Channel is
          # `latest` for stable tags, `beta` for pre-release tags.
          npm publish --workspace Common  --tag "$CHANNEL" --access public
          npm publish --workspace Admin   --tag "$CHANNEL" --access public
          npm publish --workspace Gateway --tag "$CHANNEL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}