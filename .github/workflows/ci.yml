name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-fault-injection:
    name: Billing fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run billing durability fault tests
        run: dotnet test Tests/ConduitLLM.FaultInjectionTests/ConduitLLM.FaultInjectionTests.csproj --configuration Release --verbosity normal

  billing-invariants:
    name: Billing invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run required billing invariant gate
        run: dotnet test Tests/ConduitLLM.BillingInvariantTests/ConduitLLM.BillingInvariantTests.csproj --configuration Release --verbosity normal

  # Quick validation that everything builds
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            SDKs/Node/package-lock.json
            SDKs/Node/Admin/package-lock.json
            SDKs/Node/Gateway/package-lock.json
            SDKs/Node/Common/package-lock.json
            WebAdmin/package-lock.json
      
      - name: .NET Build & Test
        run: |
          dotnet restore
          dotnet build --no-restore
          # Run tests but exclude integration tests and timing-sensitive tests
          dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~IntegrationTests&Category!=TimingSensitive"
        env:
          TEST_REDIS_CONNECTION: localhost:6379
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb

      # Wolverine build-ahead codegen check (#961): compiles the handler chain for EVERY
      # registered event type up front via JasperFx's `codegen preview`, so codegen /
      # service-location incompatibilities (the class of defect behind W2 in the #929 S1
      # smoke, which only surfaced at first message delivery) fail the build instead.
      - name: Wolverine codegen check
        run: |
          check_codegen() {
            local log="/tmp/codegen-$2.log"
            if dotnet run --project "$1" --no-build -- codegen preview > "$log" 2>&1; then
              echo "$2 codegen OK ($(grep -c '// START:' "$log") generated types)"
            else
              echo "$2 codegen FAILED:"
              cat "$log"
              return 1
            fi
          }
          check_codegen Services/ConduitLLM.Gateway gateway
          check_codegen Services/ConduitLLM.Admin admin
        env:
          ConduitLLM__Messaging__Backend: Wolverine
          ConduitLLM__Messaging__Wolverine__Transport: Postgresql
          CONDUIT_MIGRATION_MODE: Skip
          ASPNETCORE_ENVIRONMENT: Production
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

      - name: NPM Build
        run: |
          cd SDKs/Node
          npm ci
          npm run build
          npm run type-check
          npm run test:ci

      - name: Admin OpenAPI drift check
        # Regenerates the Admin OpenAPI spec (at build time, no running service needed)
        # and the Admin SDK generated types, then fails if they differ from what is
        # committed. This keeps backend DTOs and SDK types from silently drifting apart.
        run: |
          cd SDKs/Node/scripts
          npm ci
          npm run generate:admin:offline
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- Services/ConduitLLM.Admin/openapi-admin.json SDKs/Node/Admin/src/generated/admin-api.ts; then
            echo "::error::Admin OpenAPI spec or generated SDK types are out of date. Run 'npm run generate:admin:offline' in SDKs/Node/scripts and commit the changes."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb

      - name: WebAdmin Lint & Type Check
        run: |
          cd WebAdmin
          npm ci
          # Clean any stale .next directory before type checking
          rm -rf .next
          npm run lint
          npm run type-check

  # Two-host Wolverine listener assertion (#961): boots the REAL Gateway + Admin hosts
  # against real Postgres with ConduitLLM:Messaging:Backend=Wolverine and asserts that
  # each service forms its own node cluster (per-service durability schema) and that the
  # Gateway starts listeners for all five queues, including the exclusive strict-ordered
  # spend-update-events / image-generation-events. Guards against W1 from the #929 S1
  # smoke (shared agent cluster => financial queue dead), which only exists with two
  # real hosts on real Postgres and is invisible to the in-memory dual-backend tests.
  wolverine-two-host:
    name: Wolverine Two-Host Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build services
        run: |
          dotnet build Services/ConduitLLM.Gateway
          dotnet build Services/ConduitLLM.Admin

      - name: Two-host listener assertion
        run: pwsh ./scripts/test/wolverine-two-host-smoke.ps1 -NoBuild
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

  # Build Docker images (push only from master)
  docker:
    name: Docker - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: webadmin
            context: .
            dockerfile: WebAdmin/Dockerfile
          - service: http
            context: .
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile
          - service: admin
            context: .
            dockerfile: Services/ConduitLLM.Admin/Dockerfile
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Publish NPM packages (only from master)
  npm-publish:
    name: NPM Publish
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            SDKs/Node/package-lock.json
            SDKs/Node/Admin/package-lock.json
            SDKs/Node/Gateway/package-lock.json
            SDKs/Node/Common/package-lock.json

      - name: Build and Publish
        run: |
          cd SDKs/Node
          npm ci
          npm run build
          
          # Generate unique timestamp suffix for continuous releases
          TIMESTAMP=$(date +%s)
          
          # Update version and publish Common first (others depend on it)
          cd Common
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          npm version "${CURRENT_VERSION}-next.${TIMESTAMP}" --no-git-tag-version
          npm publish --tag next --access public
          
          # Update version and publish Admin
          cd ../Admin
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          npm version "${CURRENT_VERSION}-next.${TIMESTAMP}" --no-git-tag-version
          npm publish --tag next --access public
          
          # Update version and publish Gateway
          cd ../Gateway
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          npm version "${CURRENT_VERSION}-next.${TIMESTAMP}" --no-git-tag-version
          npm publish --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
