name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-ignore-guard:
    name: Source ignore guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure source files are not ignored
        shell: bash
        run: |
          ignored_sources="$(
            {
              git ls-files --cached --ignored --exclude-standard -- \
                'Shared/**' 'Services/**' 'Tests/**' 'WebAdmin/src/**'
              git ls-files --others --ignored --exclude-standard -- \
                'Shared/**' 'Services/**' 'Tests/**' 'WebAdmin/src/**'
            } | grep -E '\.(cs|ts|tsx)$' | sort -u || true
          )"

          if [[ -n "$ignored_sources" ]]; then
            echo "::error::Source files must not be excluded by .gitignore:"
            echo "$ignored_sources"
            exit 1
          fi

  billing-fault-injection:
    name: Billing fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run billing durability fault tests
        run: dotnet test Tests/ConduitLLM.FaultInjectionTests/ConduitLLM.FaultInjectionTests.csproj --configuration Release --verbosity normal

  billing-invariants:
    name: Billing invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run required billing invariant gate
        run: dotnet test Tests/ConduitLLM.BillingInvariantTests/ConduitLLM.BillingInvariantTests.csproj --configuration Release --verbosity normal

  signalr-integration:
    name: SignalR integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run self-contained SignalR integration tests
        run: dotnet test Tests/ConduitLLM.IntegrationTests/ConduitLLM.IntegrationTests.csproj --configuration Release --verbosity normal --filter "Component=SignalR"

  # Provider and critical-path integration suites remain manual: they require
  # already-running Conduit services plus provider credentials. The SignalR
  # component is self-contained through Testcontainers and is required in CI.

  # Quick validation that everything builds
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/openapi/package-lock.json
            WebAdmin/package-lock.json
      
      - name: .NET Build & Test
        run: |
          dotnet restore
          dotnet build --no-restore
          # Run tests but exclude integration tests and timing-sensitive tests
          dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~IntegrationTests&Category!=TimingSensitive"
        env:
          TEST_REDIS_CONNECTION: localhost:6379
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb

      # Wolverine build-ahead codegen check (#961): compiles the handler chain for EVERY
      # registered event type up front via JasperFx's `codegen preview`, so codegen /
      # service-location incompatibilities (the class of defect behind W2 in the #929 S1
      # smoke, which only surfaced at first message delivery) fail the build instead.
      - name: Wolverine codegen check
        run: |
          check_codegen() {
            local log="/tmp/codegen-$2.log"
            if dotnet run --project "$1" --no-build -- codegen preview > "$log" 2>&1; then
              echo "$2 codegen OK ($(grep -c '// START:' "$log") generated types)"
            else
              echo "$2 codegen FAILED:"
              cat "$log"
              return 1
            fi
          }
          check_codegen Services/ConduitLLM.Gateway gateway
          check_codegen Services/ConduitLLM.Admin admin
        env:
          ConduitLLM__Messaging__Backend: Wolverine
          ConduitLLM__Messaging__Wolverine__Transport: Postgresql
          CONDUIT_MIGRATION_MODE: Skip
          ASPNETCORE_ENVIRONMENT: Production
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

      - name: OpenAPI contract validation and drift check
        # Export both contracts without infrastructure, prove generation is byte-stable,
        # regenerate WebAdmin contract types, validate the contracts, and fail on drift.
        run: |
          cd tools/openapi
          npm ci
          npm run verify:offline
          npm run validate:openapi
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- \
            Services/ConduitLLM.Admin/openapi-admin.json \
            Services/ConduitLLM.Gateway/openapi-gateway.json \
            WebAdmin/src/generated/admin-api.ts \
            WebAdmin/src/generated/gateway-api.ts; then
            echo "::error::OpenAPI contracts or generated WebAdmin types are out of date. Run 'npm run generate:offline' in tools/openapi and commit the changes."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb

      - name: WebAdmin Lint, Type Check & Tests
        run: |
          cd WebAdmin
          npm ci
          # Clean any stale .next directory before type checking
          rm -rf .next
          npm run lint
          npm run type-check
          npm run check:api-boundary
          npm test -- --runInBand

  # Two-host Wolverine listener assertion (#961): boots the REAL Gateway + Admin hosts
  # against real Postgres with ConduitLLM:Messaging:Backend=Wolverine and asserts that
  # each service forms its own node cluster (per-service durability schema) and that the
  # Gateway starts listeners for all five queues, including the exclusive strict-ordered
  # spend-update-events / image-generation-events. Guards against W1 from the #929 S1
  # smoke (shared agent cluster => financial queue dead), which only exists with two
  # real hosts on real Postgres and is invisible to the in-memory dual-backend tests.
  wolverine-two-host:
    name: Wolverine Two-Host Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build services
        run: |
          dotnet build Services/ConduitLLM.Gateway
          dotnet build Services/ConduitLLM.Admin

      - name: Two-host listener assertion
        run: pwsh ./scripts/test/wolverine-two-host-smoke.ps1 -NoBuild
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

  # Build Docker images for validation only — never pushed from CI.
  # All image publishing happens from `v*` tags in release.yml.
  docker:
    name: Docker - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: webadmin
            context: .
            dockerfile: WebAdmin/Dockerfile
          - service: http
            context: .
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile
          - service: admin
            context: .
            dockerfile: Services/ConduitLLM.Admin/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only validation — images are never pushed from CI. This still catches
      # Dockerfile and production-build breakage (notably WebAdmin's `next build`,
      # which runs nowhere else in CI) before it can reach a release.
      - name: Build (validation only, no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: conduit-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
