global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'conduit-monitor'

# Recording rules for pre-aggregated cost and performance metrics
# These improve dashboard query performance and reduce cardinality
rule_files:
  - /etc/prometheus/rules/conduit_costs.yml
  - /etc/prometheus/rules/conduit_performance.yml

scrape_configs:
  # Scrape Gateway API metrics - DNS SD discovers all instances
  # When scaled (e.g., --scale api=3), Docker DNS returns all container IPs
  - job_name: 'conduit-api'
    dns_sd_configs:
      - names:
          - 'api'
        type: 'A'
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):8080'
        replacement: 'api-${1}'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape Admin API metrics - DNS SD discovers all instances
  - job_name: 'conduit-admin'
    dns_sd_configs:
      - names:
          - 'admin'
        type: 'A'
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):8080'
        replacement: 'admin-${1}'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Scrape Redis Exporter metrics (single instance - Redis isn't horizontally scaled)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    scrape_interval: 10s

  # Scrape RabbitMQ Exporter metrics (single instance - RabbitMQ cluster would need different approach)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
        labels:
          service: 'rabbitmq'
    scrape_interval: 10s

  # Scrape PostgreSQL Exporter metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
    scrape_interval: 10s
